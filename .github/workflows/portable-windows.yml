name: Portable Windows build

# Builds the portable Windows zip (CineVault.exe + `portable` marker) and uploads it as a workflow
# artifact. It publishes no release. Run it by hand (Actions → Portable Windows build → Run
# workflow) or by pushing to a `build/**` branch.
on:
  workflow_dispatch:
  push:
    branches: ["build/**"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  portable:
    name: Portable zip (Windows)
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-build
        with:
          cache-key: portable

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          cd ui && bun install --frozen-lockfile

      - name: UI typecheck and tests
        run: |
          cd ui
          bun run typecheck
          bun run test

      # Builds the UI (beforeBuildCommand) and the release executable, without the installers.
      - name: Build the executable
        run: bun run tauri build --no-bundle

      - name: Package the portable zip
        run: node scripts/package-portable.mjs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: CineVault-portable-windows
          path: target/release/bundle/portable/*.zip
          if-no-files-found: error
