name: Docker image

# Builds the server image from the Dockerfile and pushes it to the GitHub Container Registry as
# ghcr.io/<owner>/cinevault-fr, so `docker compose pull` and the Unraid template can use it without
# waiting for a release. A release (release.yml) pushes the version tag and moves `latest` too.
#
#   push to main  -> :edge and :sha-<commit>
#   by hand       -> Actions → Docker image → Run workflow (tags :edge, or :latest if ticked)
on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "cli/**"
      - "ui/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "CHANGELOG.md"
      - "Dockerfile"
      - ".dockerignore"
      - "packaging/entrypoint.sh"
      - ".github/workflows/docker.yml"
  workflow_dispatch:
    inputs:
      latest:
        description: Also move the latest tag
        type: boolean
        default: false

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and push the server image
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/cinevault-fr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Version
        id: version
        run: |
          version=$(node -e 'console.log(require("./package.json").version)')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          node scripts/check-version.mjs "$version"

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: tags
        run: |
          {
            echo "list<<EOF"
            echo "$IMAGE:edge"
            echo "$IMAGE:sha-${GITHUB_SHA::7}"
            if [ "${{ inputs.latest }}" = "true" ]; then echo "$IMAGE:latest"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            CINEVAULT_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.tags.outputs.list }}
